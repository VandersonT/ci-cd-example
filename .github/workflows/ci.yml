name: CI

on:
    push:
        branches:
        - main
        - dev
    pull_request:
        branches:
        - dev

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Instalar o Node
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Instalar dependências
              run: npm install

            - name: Executar testes
              run: npm run test

    buildAqui:
      runs-on: ubuntu-latest
      needs: test
      steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Instalar o Node
              uses: actions/setup-node@v4
              with:
                node-version: 22

            - name: Instalar dependências
              run: npm install

            - name: Roda o build
              run: npm run build